  <!-- Знак «ГенИИ»: шесть тонких рукавов, закрученных вокруг центра,
       и светящиеся точки на их концах. Свечение — размытая копия самих
       линий, поэтому знак читается и на тёмном, и на светлом фоне. -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotglow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

