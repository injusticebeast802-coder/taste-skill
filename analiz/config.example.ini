; ==========================================================
;  Настройки проверки. Скопируйте этот файл в config.ini
;  и впишите свои ключи вместо многоточий.
;  config.ini в репозиторий не попадает — он в .gitignore.
; ==========================================================

[keys]

; --- Телеграм ---
; Токен бота. Взять у @BotFather: /newbot, придумать имя.
; Можно указать токен того же бота, что принимает заявки с сайта:
; сайт только отправляет сообщения и опросу не мешает.
telegram_token = ...

; Обращение к телеграму через свой сайт. Заполняют, если в окне
; запуска идёт «Телеграм не отвечает»: у российских провайдеров
; api.telegram.org закрыт, а хостинг до него достаёт — заявки с форм
; сайта уходят в того же бота и приходят.
; Адрес: ваш сайт + /tg.php?k= + тот же пароль, что стоит в config.php
; на хостинге в строке TG_RELAY_KEY. Например:
;   telegram_api = https://genii-ai.ru/tg.php?k=ваш-длинный-пароль
; Файл лежит на обоих сайтах, бот один — годится любой адрес:
;   telegram_api = https://prompter-ai.moscow/tg.php?k=ваш-длинный-пароль
; Если один сайт недоступен, достаточно поменять здесь адрес на второй.
; Если заполнено, telegram_token здесь не нужен: он остаётся на
; хостинге и на этот компьютер не попадает.
telegram_api =

; Прокси — только если телеграм не открывается с этого компьютера.
; Признак: в окне запуска идёт «Телеграм не отвечает», а сайт и заявки
; при этом работают. У российских провайдеров api.telegram.org закрыт.
; Оставьте пусто, если пользуетесь VPN на всём компьютере — тогда
; ничего вписывать не нужно.
; Через этот адрес идёт только телеграм. Яндекс, GigaChat и DaData
; работают напрямую: они открыты, а из-за границы Яндекс отвечает
; отказом.
; Примеры:
;   telegram_proxy = http://логин:пароль@адрес:порт
;   telegram_proxy = socks5://логин:пароль@адрес:порт
telegram_proxy =

; Кому разрешено пользоваться ботом. Свой номер узнать у @userinfobot.
; Несколько — через запятую. Пусто — разрешено всем, кто найдёт бота;
; так лучше не оставлять, каждая проверка стоит денег.
allowed_chats =

; --- Справочник компаний по ИНН ---
; dadata.ru, личный кабинет -> API-ключ. Бесплатно 10 000 в сутки.
dadata_token = ...

; --- Яндекс Облако: нейросеть и поиск ---
; console.yandex.cloud: создать сервисный аккаунт, выдать ему роли
; ai.languageModels.user и search-api.webSearch.user, создать API-ключ.
; Идентификатор каталога виден в адресной строке консоли.
yandex_folder_id = ...
yandex_api_key = ...
; Ключ для поиска. Обычно тот же самый — тогда просто повторите его.
; Если поиск не подключён, оставьте пусто: проверка пройдёт только
; по нейросетям, без мест в выдаче.
yandex_search_key = ...
; yandexgpt отвечает точнее и реже выдумывает названия. Дешёвый
; yandexgpt-lite на проверке присутствия занижает: он чаще сочиняет
; правдоподобные, но несуществующие компании вместо настоящих.
; Разница в деньгах — копейки на проверку, поэтому по умолчанию
; стоит обычный.
yandex_model = yandexgpt

; --- GigaChat ---
; developers.sber.ru/studio -> проект GigaChat API -> ключ авторизации
; (длинная строка вида ZDk...==). Для физлица оставьте scope как есть.
gigachat_auth_key = ...
gigachat_scope = GIGACHAT_API_PERS
; Сбер подписывает свой сервер российским сертификатом, которого в
; Windows нет, и соединение обрывается. По умолчанию стоит no —
; проверка подлинности сервера снята. Правильнее установить
; российский корневой сертификат с gu.ru и вернуть yes.
gigachat_verify = no

; --- Сколько спрашивать ---
; Вопросов нейросетям. Каждый задаётся обеим, то есть 12 вопросов —
; это 24 обращения. Больше вопросов — точнее картина и дороже проверка.
questions = 12
; Запросов в обычном поиске.
search_queries = 5
; Пауза между обращениями, секунды. Мешает упереться в ограничение
; по частоте у Яндекса и Сбера.
pause = 0.4

; Куда складывать готовые картинки.
out_dir = otchety
