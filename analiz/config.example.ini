; ==========================================================
;  Настройки проверки. Скопируйте этот файл в config.ini
;  и впишите свои ключи вместо многоточий.
;  config.ini в репозиторий не попадает — он в .gitignore.
; ==========================================================

[keys]

; --- Телеграм ---
; Токен бота. Взять у @BotFather: /newbot, придумать имя.
; Можно указать токен того же бота, что принимает заявки с сайта:
; сайт только отправляет сообщения и опросу не мешает.
telegram_token = ...

; Кому разрешено пользоваться ботом. Свой номер узнать у @userinfobot.
; Несколько — через запятую. Пусто — разрешено всем, кто найдёт бота;
; так лучше не оставлять, каждая проверка стоит денег.
allowed_chats =

; --- Справочник компаний по ИНН ---
; dadata.ru, личный кабинет -> API-ключ. Бесплатно 10 000 в сутки.
dadata_token = ...

; --- Яндекс Облако: нейросеть и поиск ---
; console.yandex.cloud: создать сервисный аккаунт, выдать ему роли
; ai.languageModels.user и search-api.webSearch.user, создать API-ключ.
; Идентификатор каталога виден в адресной строке консоли.
yandex_folder_id = ...
yandex_api_key = ...
; Ключ для поиска. Обычно тот же самый — тогда просто повторите его.
; Если поиск не подключён, оставьте пусто: проверка пройдёт только
; по нейросетям, без мест в выдаче.
yandex_search_key = ...
; yandexgpt-lite дешевле и для этой задачи достаточно.
; Точнее отвечает yandexgpt, но стоит примерно вчетверо дороже.
yandex_model = yandexgpt-lite

; --- GigaChat ---
; developers.sber.ru/studio -> проект GigaChat API -> ключ авторизации
; (длинная строка вида ZDk...==). Для физлица оставьте scope как есть.
gigachat_auth_key = ...
gigachat_scope = GIGACHAT_API_PERS
; Сбер подписывает свой сервер российским сертификатом. Если при
; запуске ругается на сертификат — поставьте no. Это снимает проверку
; подлинности сервера, поэтому лучше сначала установить российский
; корневой сертификат с gu.ru, и только если не вышло — ставить no.
gigachat_verify = yes

; --- Сколько спрашивать ---
; Вопросов нейросетям. Каждый задаётся обеим, то есть 12 вопросов —
; это 24 обращения. Больше вопросов — точнее картина и дороже проверка.
questions = 12
; Запросов в обычном поиске.
search_queries = 5
; Пауза между обращениями, секунды. Мешает упереться в ограничение
; по частоте у Яндекса и Сбера.
pause = 0.4

; Куда складывать готовые картинки.
out_dir = otchety
