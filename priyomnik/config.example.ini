; ==========================================================
;  Настройки бота-приёмщика. Скопируйте этот файл в config.ini
;  и впишите свои значения вместо многоточий.
;  config.ini в репозиторий не попадает — он в .gitignore.
; ==========================================================

[keys]

; Токен бота-приёмщика. Взять у @BotFather: /newbot.
; Это ОТДЕЛЬНЫЙ бот от того, что считает отчёты: сюда приходят
; клиенты, туда — только менеджеры.
telegram_token = ...

; Обращение к телеграму через посредника. Заполняют, если при запуске
; бот пишет «до телеграма с этой машины хода нет ни по одной версии
; адресов»: api.telegram.org закрыт у российских провайдеров, и у
; хостингов тоже не всегда открыт.
;
; Адрес: сайт + /tg.php?k= + тот же пароль, что в config.php на
; хостинге в строке TG_RELAY_KEY. Например:
;   telegram_api = https://genii-ai.ru/tg.php?k=ваш-длинный-пароль
;
; ВАЖНО: посредник общий с ботом отчётов, а токены у ботов разные.
; Свой токен бот подставляет не сам — его надо вписать на хостинге
; в config.php рядом с tg.php, в строку TG_TOKEN_PRIYOM. Без этого
; посредник ответит «не заполнен TG_TOKEN_PRIYOM».
;
; Если до телеграма не достаёт и сам хостинг, в config.php заполняют
; TG_WORKER — адрес работника Cloudflare, — а токен приёмщика кладут
; в настройки работника строкой TG_TOKEN_PRIYOM.
;
; Если заполнено, telegram_token здесь не нужен.
telegram_api =

; Прокси — только для телеграма и только если он не открывается.
;   telegram_proxy = socks5://логин:пароль@адрес:порт
telegram_proxy =

; Канал, подписку на который проверяем. С собачкой.
; Бот обязан быть его администратором, иначе телеграм не ответит
; на вопрос «подписан ли этот человек». Прав публиковать не нужно,
; достаточно добавить в администраторы с пустым набором прав.
kanal = @geniimoscow

; Ссылка на канал для кнопки «Подписаться». Если пусто —
; соберём из названия канала.
kanal_ssylka =

; Адрес анкеты на сайте. Бот даёт на неё ссылку тем, кому удобнее
; заполнить одной формой, а не отвечать по одному вопросу в чате.
sajt_anketa = https://genii-ai.ru/analiz

; То же самое для второго сайта. Бот и канал у сайтов общие, а анкеты
; разные: вернуть человека надо туда, откуда он пришёл. Откуда —
; видно по метке в ссылке: на промптере она начинается с «prompter».
sajt_anketa_prompter = https://prompter-ai.moscow/analiz

; Общий секрет с сайтом. Любая длинная случайная строка — например,
; из 40 букв и цифр. Этот же секрет впишите на хостинге в config.php
; рядом с lead.php, в строку RAZBOR_SECRET.
;
; Зачем: бот проверяет подписку и выдаёт ссылку на анкету с ключом.
; Ключ подписан этим секретом, и сайт по подписи понимает, что человек
; подписку прошёл. Общая база при этом не нужна — сайт проверяет
; подпись арифметикой, а не запросом к боту.
;
; Если оставить пусто, ссылка на анкету всё равно работает, но заявка
; придёт без отметки о подписке.
sekret_ssylki =

; Куда складывать готовые заявки: рабочий чат менеджеров.
;
; Руками сюда лучше ничего не вписывать. Добавьте бота в чат
; менеджеров обычным участником и напишите там:
;     /zayavki_syuda
; Бот сам запишет номер в эту строку и ответит, что заявки пойдут
; туда. Перезапускать его при этом не нужно.
;
; Почему так, а не цифрами: номер обычно переписывают у другого бота,
; и он верный — а телеграм всё равно отвечает «chat not found», потому
; что право писать он выдаёт не номеру, а участнику. Команда же
; приходит из того самого чата, где бот уже состоит.
;
; Пока не заполнено, бот запускаться не станет: поставьте любое число,
; например 0, и смените командой.
chat_zayavok = 0
